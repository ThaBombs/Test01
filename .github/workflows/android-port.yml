name: Android port probe

on:
  push:
    branches: [ master ]
    paths:
      - "android/**"
      - "port/**"
      - "src/**"
      - "include/**"
      - "PORTING_STATUS.md"
      - ".github/workflows/android-port.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android NDK and CMake
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Prepare pokeemerald asset tools
        run: |
          make -j2 tools

      - name: Prepare generated assets
        run: |
          make -j2 generated

      - name: Build Android debug APK
        run: |
          gradle -p android :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-native-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
