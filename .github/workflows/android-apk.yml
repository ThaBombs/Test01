name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "android/**"
      - "port/**"
      - "src/**"
      - "include/**"
      - "data/**"
      - "tools/**"
      - "Makefile"
      - "make_tools.mk"
      - "map_data_rules.mk"
      - "json_data_rules.mk"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "port/**"
      - "src/**"
      - "include/**"
      - "data/**"
      - "tools/**"
      - "Makefile"
      - "make_tools.mk"
      - "map_data_rules.mk"
      - "json_data_rules.mk"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install game data generation prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build pokeemerald host tools
        shell: bash
        run: |
          set -euo pipefail
          make -j2 tools

      - name: Generate pokeemerald headers
        shell: bash
        run: |
          set -euo pipefail
          make -j2 generated

      - name: Prepare Android menu compatibility assets
        shell: bash
        run: |
          set -euo pipefail
          make -j2 \
            build/emerald/src/main_menu.o \
            build/emerald/src/option_menu.o \
            build/emerald/src/text.o \
            build/emerald/src/menu.o \
            build/emerald/src/fonts.o \
            build/emerald/src/text_window.o \
            build/emerald/src/pokemon.o \
            build/emerald/src/graphics.o \
            build/emerald/src/battle_gimmick.o \
            build/emerald/src/starter_choose.o \
            build/emerald/src/battle_anim.o \
            build/emerald/src/battle_anim_bug.o \
            build/emerald/src/battle_anim_dark.o \
            build/emerald/src/battle_anim_dragon.o \
            build/emerald/src/battle_anim_effects_1.o \
            build/emerald/src/battle_anim_effects_2.o \
            build/emerald/src/battle_anim_effects_3.o \
            build/emerald/src/battle_anim_electric.o \
            build/emerald/src/battle_anim_fight.o \
            build/emerald/src/battle_anim_fire.o \
            build/emerald/src/battle_anim_flying.o \
            build/emerald/src/battle_anim_ghost.o \
            build/emerald/src/battle_anim_ground.o \
            build/emerald/src/battle_anim_ice.o \
            build/emerald/src/battle_anim_mon_movement.o \
            build/emerald/src/battle_anim_mons.o \
            build/emerald/src/battle_anim_new.o \
            build/emerald/src/battle_anim_normal.o \
            build/emerald/src/battle_anim_poison.o \
            build/emerald/src/battle_anim_psychic.o \
            build/emerald/src/battle_anim_rock.o \
            build/emerald/src/battle_anim_smokescreen.o \
            build/emerald/src/battle_anim_sound_tasks.o \
            build/emerald/src/battle_anim_status_effects.o \
            build/emerald/src/battle_anim_throw.o \
            build/emerald/src/battle_anim_utility_funcs.o \
            build/emerald/src/battle_anim_water.o \
            build/emerald/src/field_weather.o \
            build/emerald/src/party_menu.o \
            build/emerald/src/pokeball.o \
            build/emerald/src/sound.o \
            build/emerald/src/berry.o \
            build/emerald/src/battle_arena.o \
            build/emerald/src/battle_tv.o

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        id: build_apk
        shell: bash
        continue-on-error: true
        run: |
          set +e
          gradle -p android :app:assembleDebug --stacktrace 2>&1 | tee android/native-build.log
          status=${PIPESTATUS[0]}
          grep -E -B2 -A4 '(error:|fatal error:|undefined reference|FAILED:|ninja: build stopped)' android/native-build.log \
            | head -n 240 > android/native-build-errors.txt || true
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-build-errors-${{ github.sha }}
          path: android/native-build-errors.txt
          if-no-files-found: error
          retention-days: 30

      - name: Stop after failed native build
        if: steps.build_apk.outputs.status != '0'
        run: exit 1

      - name: Report real battle probe dependencies
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # CMake computes this from the combined relocatable object containing
          # the real Emerald battle C engine, Android first-battle bridge and
          # both full battle-script objects.
          if [ -f android/real-battle-unresolved.txt ]; then
            echo "Combined Emerald battle path unresolved symbols:"
            cat android/real-battle-unresolved.txt
          else
            echo "Combined real battle dependency report was not generated."
          fi

      - name: Upload real battle probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-battle-probe-${{ github.sha }}
          path: android/real-battle-unresolved.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Report engine probe dependencies
        shell: bash
        run: |
          set -euo pipefail
          NDK_NM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          PROBE="$(find android/app -type f -name 'libpokeemerald_engine_probe.a' -path '*arm64-v8a*' | head -n 1)"
          if [ -z "$PROBE" ]; then
            echo "Engine probe archive was not built." >&2
            exit 1
          fi
          echo "Engine probe: $PROBE"
          "$NDK_NM" -u "$PROBE" | sed -E 's/^[[:space:]]*U[[:space:]]+//' | sort -u | tee android/engine-unresolved.txt

      - name: Report main-menu probe dependencies
        shell: bash
        run: |
          set -euo pipefail
          NDK_NM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          PROBE="$(find android/app -type f -name 'libpokeemerald_main_menu_probe.a' -path '*arm64-v8a*' | head -n 1)"
          if [ -z "$PROBE" ]; then
            echo "Main-menu probe archive was not built." >&2
            exit 1
          fi
          echo "Main-menu probe: $PROBE"
          "$NDK_NM" -u "$PROBE" | sed -E 's/^[[:space:]]*U[[:space:]]+//' | sort -u | tee android/main-menu-unresolved.txt

      - name: Upload NEW GAME compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-game-overworld-compile-${{ github.sha }}
          path: |
            android/new-game-compile.txt
            android/overworld-compile.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-native-android-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
