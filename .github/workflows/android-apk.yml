name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "android/**"
      - "port/**"
      - "src/**"
      - "include/**"
      - "data/**"
      - "tools/**"
      - "Makefile"
      - "make_tools.mk"
      - "map_data_rules.mk"
      - "json_data_rules.mk"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "port/**"
      - "src/**"
      - "include/**"
      - "data/**"
      - "tools/**"
      - "Makefile"
      - "make_tools.mk"
      - "map_data_rules.mk"
      - "json_data_rules.mk"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install game data generation prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build pokeemerald host tools
        shell: bash
        run: |
          set -euo pipefail
          make -j2 tools

      - name: Generate pokeemerald headers
        shell: bash
        run: |
          set -euo pipefail
          make -j2 generated

      - name: Prepare Android menu compatibility assets
        shell: bash
        run: |
          set -euo pipefail
          make -j2 build/emerald/src/main_menu.o build/emerald/src/option_menu.o build/emerald/src/text.o build/emerald/src/menu.o build/emerald/src/fonts.o build/emerald/src/text_window.o

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Report engine probe dependencies
        shell: bash
        run: |
          set -euo pipefail
          NDK_NM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          PROBE="$(find android/app -type f -name 'libpokeemerald_engine_probe.a' -path '*arm64-v8a*' | head -n 1)"
          if [ -z "$PROBE" ]; then
            echo "Engine probe archive was not built." >&2
            exit 1
          fi
          echo "Engine probe: $PROBE"
          "$NDK_NM" -u "$PROBE" | sed -E 's/^[[:space:]]*U[[:space:]]+//' | sort -u | tee android/engine-unresolved.txt

      - name: Report main-menu probe dependencies
        shell: bash
        run: |
          set -euo pipefail
          NDK_NM="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          PROBE="$(find android/app -type f -name 'libpokeemerald_main_menu_probe.a' -path '*arm64-v8a*' | head -n 1)"
          if [ -z "$PROBE" ]; then
            echo "Main-menu probe archive was not built." >&2
            exit 1
          fi
          echo "Main-menu probe: $PROBE"
          "$NDK_NM" -u "$PROBE" | sed -E 's/^[[:space:]]*U[[:space:]]+//' | sort -u | tee android/main-menu-unresolved.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-native-android-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
