name: Android Native APK

on:
  push:
    branches:
      - test-starter-overhaul
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout game and SDL2
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libpng-dev python3 python3-pil ninja-build

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Build Expansion preprocessing tools
        run: |
          make -f make_tools.mk -j"$(nproc)"
          make generated -j"$(nproc)" GAME_VERSION=EMERALD

      - name: Apply Aquarius test content generators
        run: |
          python3 tools/generate_test01_sprites.py
          python3 tools/apply_test01_swamp.py
          make generated -j"$(nproc)" GAME_VERSION=EMERALD

      - name: Patch SDL2 Android lifecycle
        run: |
          if git -C android/SDL2 apply --check ../patches/sdl2-android-lifecycle.patch; then
            git -C android/SDL2 apply ../patches/sdl2-android-lifecycle.patch
          fi

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x android/SDL2/android-project/gradlew
          android/SDL2/android-project/gradlew -p android :app:assembleDebug --stacktrace

      - name: Stage APK
        if: success()
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Aquarius-native-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aquarius-native-apk-${{ github.sha }}
          path: Aquarius-native-debug.apk
          if-no-files-found: error
          retention-days: 30
